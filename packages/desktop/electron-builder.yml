appId: com.sentinel.desktop
productName: Sentinel
directories:
  buildResources: resources
# Runtime assets (window/tray icons) resolved via process.resourcesPath
extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - tray.png
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.*'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# Native Claude CLI binaries cannot be spawned from inside the asar -
# extract the Agent SDK and its platform packages next to it.
asarUnpack:
  - 'node_modules/@anthropic-ai/claude-agent-sdk/**'
  - 'node_modules/@anthropic-ai/claude-agent-sdk-*/**'
win:
  executableName: sentinel
  icon: resources/icon.ico
  target:
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  icon: resources/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: sentinel.dev
  category: Utility
publish:
  provider: github
