# Task Configuration — with Loop Engineering (Agent Loop)
name: daily-news-summary
description: 每天早上9点整理AI/科技新闻摘要
version: 2

schedule:
  type: cron
  expr: "0 9 * * *"
  timezone: Asia/Shanghai

execution:
  prompt: |
    请浏览今天的 AI/科技领域重要新闻，整理一份中文摘要。

    要求：
    1. 提取 5-10 条最重要的新闻
    2. 每条新闻用 2-3 句话概括核心要点
    3. 按重要性排序
    4. 输出为 markdown 格式，保存到 output/daily-$(date +%Y-%m-%d).md
    5. 在文件顶部注明日期和生成时间
    
    请使用 news-digest skill。
  model: ""
  agent: default
  timeout: 600
  retry:
    max: 2
    delay: 60
  fixPromptTemplate: |
    上一次执行的验证未通过。

    ## 验证反馈
    {verification}

    ## 上次输出摘要
    {output}

    请根据验证反馈修复问题并重新生成摘要。确保输出文件存在且包含有效内容。

# ─── Loop Engineering: Agent Loop ────────────────────────────
# When enabled, the scheduler runs: execute → verify → fix → iterate
# This is the core of Loop Engineering — design the loop, not the prompt.
agentLoop:
  enabled: true
  maxIterations: 3
  verification:
    # 'command' mode: run a shell command, exit code 0 = pass (zero LLM cost)
    # 'llm' mode: use LLM to semantically verify output quality
    type: command
    command: "test -f output/daily-$(date +%Y-%m-%d).md && grep -q '^##' output/daily-$(date +%Y-%m-%d).md"
    onFailure: iterate  # iterate | notify | stop

notify:
  on_success: none
  on_failure: webhook
  webhook_url: ""
